<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="curve-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="curve-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="bar-grad-1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bar-grad-2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bar-grad-3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Background Blobs -->
  <circle cx="380" cy="90" r="110" fill="#ec4899" fill-opacity="0.18" filter="url(#soft-glow)"/>
  <circle cx="100" cy="220" r="90" fill="#38bdf8" fill-opacity="0.15" filter="url(#soft-glow)"/>

  <!-- Grid Guide Lines -->
  <g opacity="0.25" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 6">
    <line x1="40" y1="260" x2="440" y2="260"/>
    <line x1="40" y1="200" x2="440" y2="200"/>
    <line x1="40" y1="140" x2="440" y2="140"/>
    <line x1="40" y1="80" x2="440" y2="80"/>
  </g>

  <!-- Growth Area Fill Under Curve -->
  <path d="M 50 250 Q 130 240, 190 190 T 320 140 T 430 65 L 430 260 L 50 260 Z" fill="url(#curve-glow)"/>

  <!-- Bar Visualizations -->
  <rect x="75" y="210" width="18" height="50" rx="6" fill="url(#bar-grad-1)"/>
  <rect x="135" y="170" width="18" height="90" rx="6" fill="url(#bar-grad-1)"/>
  <rect x="195" y="150" width="18" height="110" rx="6" fill="url(#bar-grad-2)"/>
  <rect x="255" y="120" width="18" height="140" rx="6" fill="url(#bar-grad-2)"/>
  <rect x="315" y="95" width="18" height="165" rx="6" fill="url(#bar-grad-3)"/>
  <rect x="375" y="65" width="18" height="195" rx="6" fill="url(#bar-grad-3)"/>

  <!-- Dynamic Trajectory Trendline -->
  <path d="M 50 250 Q 130 240, 190 190 T 320 140 T 430 65" stroke="url(#curve-grad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Metric Pulse Nodes -->
  <g filter="url(#soft-glow)">
    <circle cx="190" cy="190" r="7" fill="#38bdf8"/>
    <circle cx="320" cy="140" r="8" fill="#a855f7"/>
    <circle cx="430" cy="65" r="9" fill="#f43f5e"/>
  </g>
  <circle cx="190" cy="190" r="3" fill="#ffffff"/>
  <circle cx="320" cy="140" r="3.5" fill="#ffffff"/>
  <circle cx="430" cy="65" r="4" fill="#ffffff"/>

  <!-- Floating Milestone Badge 1 -->
  <g transform="translate(130, 100)">
    <rect width="105" height="34" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="6" fill="#10b981"/>
    <path d="M15 17 L17 19 L22 14" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="21" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Top Recruiters</text>
  </g>

  <!-- Floating Milestone Badge 2 (Top Right Target Achieved) -->
  <g transform="translate(340, 20)">
    <rect width="115" height="38" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#ec4899" stroke-width="1.2"/>
    <circle cx="20" cy="19" r="8" fill="#ec4899"/>
    <path d="M20 13 L21.5 17.5 L26 17.5 L22.5 20 L24 24.5 L20 22 L16 24.5 L17.5 20 L14 17.5 L18.5 17.5 Z" fill="#ffffff"/>
    <text x="36" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Verified Outcomes</text>
    <text x="36" y="29" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Tier 1 Offers</text>
  </g>

  <!-- Decorative Orbit Elements -->
  <circle cx="430" cy="65" r="22" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>
  <circle cx="430" cy="65" r="32" stroke="#f43f5e" stroke-width="1" stroke-dasharray="2 6" opacity="0.3"/>
</svg>
