<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="student-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="rocket-flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="card-depth" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4f46e5" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Background Ambient Aura -->
  <circle cx="140" cy="105" r="70" fill="#4f46e5" fill-opacity="0.08"/>
  <circle cx="205" cy="55" r="40" fill="#38bdf8" fill-opacity="0.15"/>

  <!-- Back Card Shadow / Perspective Sheet -->
  <rect x="52" y="32" width="156" height="136" rx="16" fill="#e2e8f0" opacity="0.6" transform="rotate(-4 130 100)"/>

  <!-- Main Student Profile Card -->
  <rect x="55" y="28" width="160" height="142" rx="16" fill="url(#student-card-grad)" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-depth)"/>

  <!-- Student Header Bar -->
  <rect x="55" y="28" width="160" height="36" rx="16" fill="url(#primary-grad)"/>
  <rect x="55" y="52" width="160" height="12" fill="url(#primary-grad)"/>

  <!-- Avatar Circle with Verification -->
  <g transform="translate(72, 46)">
    <circle cx="16" cy="16" r="16" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <circle cx="16" cy="12" r="6" fill="#818cf8"/>
    <path d="M7 28 C7 22 11 20 16 20 C21 20 25 22 25 28 Z" fill="#818cf8"/>
    <!-- Verification Checkmark -->
    <circle cx="26" cy="24" r="5.5" fill="#10b981"/>
    <path d="M23.5 24 L25.5 26 L28.5 22" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Student Name & Role Lines -->
  <rect x="116" y="70" width="80" height="8" rx="4" fill="#1e293b"/>
  <rect x="116" y="83" width="55" height="6" rx="3" fill="#64748b"/>

  <!-- Skill Badges -->
  <rect x="70" y="102" width="38" height="16" rx="8" fill="#e0e7ff"/>
  <text x="76" y="114" fill="#4338ca" font-family="system-ui, sans-serif" font-size="8" font-weight="700">Python</text>

  <rect x="114" y="102" width="38" height="16" rx="8" fill="#fce7f3"/>
  <text x="122" y="114" fill="#be185d" font-family="system-ui, sans-serif" font-size="8" font-weight="700">React</text>

  <rect x="158" y="102" width="34" height="16" rx="8" fill="#e0f2fe"/>
  <text x="165" y="114" fill="#0369a1" font-family="system-ui, sans-serif" font-size="8" font-weight="700">Data</text>

  <!-- Progress / Readiness Bar -->
  <rect x="70" y="132" width="130" height="6" rx="3" fill="#f1f5f9"/>
  <rect x="70" y="132" width="112" height="6" rx="3" fill="url(#primary-grad)"/>
  <text x="70" y="152" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">Profile Readiness: 95%</text>

  <!-- Floating Graduation Cap Icon Top Left -->
  <g transform="translate(34, 18)">
    <polygon points="22,6 38,13 22,20 6,13" fill="#1e293b"/>
    <polygon points="12,16 12,25 22,29 32,25 32,16 22,20" fill="#334155"/>
    <line x1="34" y1="14" x2="38" y2="24" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="38" cy="25" r="1.8" fill="#f59e0b"/>
  </g>

  <!-- Career Launch Rocket Flying Up Right -->
  <g transform="translate(208, 38) rotate(25)">
    <!-- Exhaust flame -->
    <path d="M12 28 Q15 40 12 44 Q9 40 12 28 Z" fill="url(#rocket-flame)"/>
    <!-- Rocket fuselage -->
    <path d="M12 4 C6 14 6 22 8 28 L16 28 C18 22 18 14 12 4 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M12 4 C10 10 10 14 12 14 C14 14 14 10 12 4 Z" fill="#ef4444"/>
    <circle cx="12" cy="18" r="2.5" fill="#38bdf8"/>
    <!-- Fins -->
    <polygon points="8,22 3,27 8,28" fill="#ef4444"/>
    <polygon points="16,22 21,27 16,28" fill="#ef4444"/>
  </g>
</svg>
