<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" fill="none">
  <defs>
    <linearGradient id="why-grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="why-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="why-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ambient background glow pods -->
  <circle cx="150" cy="120" r="100" fill="#4f46e5" fill-opacity="0.06"/>
  <circle cx="300" cy="120" r="120" fill="#8b5cf6" fill-opacity="0.08"/>
  <circle cx="450" cy="120" r="100" fill="#ec4899" fill-opacity="0.06"/>

  <!-- Connecting Ecosystem Flow Waves -->
  <path d="M 120 120 C 180 80, 240 160, 300 120 C 360 80, 420 160, 480 120" stroke="url(#why-grad-main)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" fill="none" opacity="0.6"/>

  <!-- Pulse dots along the path -->
  <circle cx="210" cy="115" r="4" fill="#6366f1"/>
  <circle cx="390" cy="125" r="4" fill="#ec4899"/>

  <!-- Hub 1: Colleges & Campuses (Left) -->
  <g transform="translate(60, 40)" filter="url(#why-shadow)">
    <rect width="130" height="140" rx="20" fill="url(#why-card-grad)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="65" cy="50" r="28" fill="#e0e7ff"/>
    <!-- Campus Icon -->
    <path d="M 65 34 L 85 45 L 45 45 Z" fill="#4f46e5"/>
    <rect x="50" y="47" width="30" height="20" fill="#4f46e5" opacity="0.9"/>
    <rect x="55" y="52" width="6" height="15" fill="#ffffff"/>
    <rect x="69" y="52" width="6" height="15" fill="#ffffff"/>
    <!-- Pillar Title -->
    <text x="65" y="98" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">50+ Colleges</text>
    <text x="65" y="115" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Unified Campuses</text>
    <rect x="35" y="130" width="60" height="16" rx="8" fill="#e0e7ff"/>
    <text x="65" y="141" fill="#4338ca" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Verified TPOs</text>
  </g>

  <!-- Hub 2: Center Smart Matching Core (Elevated) -->
  <g transform="translate(230, 20)" filter="url(#why-shadow)">
    <rect width="140" height="165" rx="24" fill="#0f172a" stroke="url(#why-grad-main)" stroke-width="2"/>
    <!-- Glowing AI Orb -->
    <circle cx="70" cy="55" r="32" fill="url(#why-grad-main)"/>
    <circle cx="70" cy="55" r="16" fill="#ffffff" opacity="0.9"/>
    <!-- Core Sparkle -->
    <path d="M70 43 L72 52 L81 55 L72 58 L70 67 L68 58 L59 55 L68 52 Z" fill="#4f46e5"/>
    <text x="70" y="108" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">AI Smart Match</text>
    <text x="70" y="126" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">3x Faster Hiring</text>
    <!-- Badge -->
    <rect x="25" y="138" width="90" height="18" rx="9" fill="#10b981"/>
    <text x="70" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">98.4% Accuracy</text>
  </g>

  <!-- Hub 3: Recruiters & Corporate Partners (Right) -->
  <g transform="translate(410, 40)" filter="url(#why-shadow)">
    <rect width="130" height="140" rx="20" fill="url(#why-card-grad)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="65" cy="50" r="28" fill="#fce7f3"/>
    <!-- Briefcase Corporate Icon -->
    <rect x="48" y="44" width="34" height="24" rx="4" fill="#ec4899"/>
    <path d="M 57 44 L 57 40 C 57 37 60 35 65 35 C 70 35 73 37 73 40 L 73 44" stroke="#ec4899" stroke-width="2" fill="none"/>
    <circle cx="65" cy="56" r="3" fill="#ffffff"/>
    <text x="65" y="98" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Hiring Partners</text>
    <text x="65" y="115" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Global Enterprises</text>
    <rect x="35" y="130" width="60" height="16" rx="8" fill="#fce7f3"/>
    <text x="65" y="141" fill="#be185d" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Direct Drives</text>
  </g>
</svg>
