<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="ai-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="ai-chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="ai-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Ambient Aura -->
  <circle cx="140" cy="100" r="75" fill="#8b5cf6" fill-opacity="0.12"/>
  <circle cx="140" cy="100" r="55" fill="#ec4899" fill-opacity="0.1"/>

  <!-- Concentric Orbital Circuit Rings -->
  <circle cx="140" cy="100" r="78" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="140" cy="100" r="62" stroke="url(#ai-glow)" stroke-width="1" stroke-dasharray="2 4" opacity="0.8"/>

  <!-- Neural Connection Nodes -->
  <line x1="140" y1="42" x2="140" y2="20" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="140" cy="18" r="4" fill="#8b5cf6"/>

  <line x1="198" y1="100" x2="225" y2="100" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
  <circle cx="228" cy="100" r="4" fill="#ec4899"/>

  <line x1="140" y1="158" x2="140" y2="182" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="140" cy="184" r="4" fill="#6366f1"/>

  <line x1="82" y1="100" x2="55" y2="100" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <circle cx="52" cy="100" r="4" fill="#06b6d4"/>

  <!-- Diagonal Nodes -->
  <line x1="175" y1="65" x2="202" y2="45" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="204" cy="43" r="3.5" fill="#8b5cf6"/>

  <line x1="105" y1="135" x2="78" y2="155" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="76" cy="157" r="3.5" fill="#3b82f6"/>

  <!-- Central Processor Base & Glass Shield -->
  <rect x="95" y="55" width="90" height="90" rx="20" fill="url(#ai-chip-grad)" filter="url(#ai-shadow)"/>
  <rect x="95" y="55" width="90" height="90" rx="20" stroke="url(#ai-glow)" stroke-width="2"/>

  <!-- Internal Processor Core Details -->
  <rect x="110" y="70" width="60" height="60" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
  
  <!-- Glowing AI Brain Core / Node Mesh -->
  <g transform="translate(122, 82)">
    <path d="M18 4 C10 4 6 10 6 18 C6 24 10 30 18 32 C26 30 30 24 30 18 C30 10 26 4 18 4 Z" fill="none" stroke="url(#ai-glow)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="18" cy="14" r="3" fill="#38bdf8"/>
    <circle cx="12" cy="22" r="2.5" fill="#a855f7"/>
    <circle cx="24" cy="22" r="2.5" fill="#ec4899"/>
    <line x1="18" y1="14" x2="12" y2="22" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <line x1="18" y1="14" x2="24" y2="22" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <line x1="12" y1="22" x2="24" y2="22" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- Floating Match Algorithm Badge -->
  <g transform="translate(162, 126)">
    <rect width="82" height="28" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="12" cy="14" r="5" fill="#10b981"/>
    <path d="M9.5 14 L11.5 16 L15 11" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="22" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">98% Match</text>
  </g>

  <!-- Algorithm Chip Pins -->
  <rect x="87" y="70" width="8" height="4" rx="1.5" fill="#94a3b8"/>
  <rect x="87" y="82" width="8" height="4" rx="1.5" fill="#94a3b8"/>
  <rect x="87" y="94" width="8" height="4" rx="1.5" fill="#94a3b8"/>
  <rect x="87" y="106" width="8" height="4" rx="1.5" fill="#94a3b8"/>
  <rect x="87" y="118" width="8" height="4" rx="1.5" fill="#94a3b8"/>

  <rect x="185" y="70" width="8" height="4" rx="1.5" fill="#94a3b8"/>
  <rect x="185" y="82" width="8" height="4" rx="1.5" fill="#94a3b8"/>
  <rect x="185" y="94" width="8" height="4" rx="1.5" fill="#94a3b8"/>
  <rect x="185" y="106" width="8" height="4" rx="1.5" fill="#94a3b8"/>
  <rect x="185" y="118" width="8" height="4" rx="1.5" fill="#94a3b8"/>
</svg>
