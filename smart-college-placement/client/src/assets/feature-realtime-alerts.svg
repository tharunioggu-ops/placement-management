<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="bell-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="notif-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="notif-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.18"/>
    </filter>
    <filter id="card-soft" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Ambient Pulsing Radiance -->
  <circle cx="85" cy="100" r="60" fill="#f59e0b" fill-opacity="0.12"/>
  <circle cx="85" cy="100" r="45" fill="#ea580c" fill-opacity="0.08"/>

  <!-- Concentric Sound / Broadcast Radar Waves -->
  <path d="M 125 70 A 45 45 0 0 1 125 130" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 140 58 A 65 65 0 0 1 140 142" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4 4" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 155 46 A 85 85 0 0 1 155 154" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="2 6" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Central Vibrant Notification Bell -->
  <g transform="translate(50, 60)" filter="url(#notif-shadow)">
    <!-- Bell Dome -->
    <path d="M 35 15 C 24 15 17 23 17 38 L 13 54 L 57 54 L 53 38 C 53 23 46 15 35 15 Z" fill="url(#bell-grad)"/>
    <!-- Bell Top Ring -->
    <circle cx="35" cy="12" r="5" stroke="#ea580c" stroke-width="2.5" fill="none"/>
    <!-- Bell Clapper / Hammer -->
    <path d="M 29 55 C 29 60 32 63 35 63 C 38 63 41 60 41 55 Z" fill="#b45309"/>
    <!-- Bell Bottom Rim Lip -->
    <rect x="11" y="52" width="48" height="4" rx="2" fill="#d97706"/>
    <!-- Live Ping Badge -->
    <circle cx="50" cy="16" r="7" fill="#ef4444"/>
    <circle cx="50" cy="16" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Floating Live Notification Card 1 (Interview Invite) -->
  <g transform="translate(132, 35)" filter="url(#card-soft)">
    <rect width="132" height="48" rx="10" fill="url(#notif-card-grad)" stroke="#fed7aa" stroke-width="1.2"/>
    <circle cx="22" cy="24" r="12" fill="#fef3c7"/>
    <!-- Lightning Flash -->
    <path d="M22 17 L18 25 L23 25 L21 31 L27 23 L22 23 Z" fill="#d97706"/>
    <text x="40" y="20" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Interview Call</text>
    <text x="40" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="7.5">Microsoft • Tomorrow 10 AM</text>
    <circle cx="120" cy="14" r="3" fill="#10b981"/>
  </g>

  <!-- Floating Live Notification Card 2 (Drive Live) -->
  <g transform="translate(142, 95)" filter="url(#card-soft)">
    <rect width="124" height="46" rx="10" fill="url(#notif-card-grad)" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="20" cy="23" r="10" fill="#e0e7ff"/>
    <path d="M16 23 L19 26 L25 19" stroke="#4f46e5" stroke-width="1.8" stroke-linecap="round"/>
    <text x="36" y="19" fill="#0f172a" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">Drive Published</text>
    <text x="36" y="31" fill="#64748b" font-family="system-ui, sans-serif" font-size="7">50+ New Openings</text>
    <text x="36" y="40" fill="#10b981" font-family="system-ui, sans-serif" font-size="6.5" font-weight="600">Just Now</text>
  </g>

  <!-- Instant Speed Indicator Badge -->
  <g transform="translate(80, 142)">
    <rect width="68" height="20" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="10" cy="10" r="3" fill="#10b981"/>
    <text x="18" y="13" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600">&lt; 1s Alerts</text>
  </g>
</svg>
