<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="an-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="an-bar-1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="an-bar-2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="an-bar-3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="trend-line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="an-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Ambient Light -->
  <circle cx="140" cy="100" r="75" fill="#ec4899" fill-opacity="0.08"/>
  <circle cx="65" cy="50" r="45" fill="#4f46e5" fill-opacity="0.08"/>

  <!-- Analytics Base Card -->
  <rect x="42" y="24" width="196" height="152" rx="14" fill="url(#an-card-bg)" stroke="#cbd5e1" stroke-width="1.2" filter="url(#an-shadow)"/>

  <!-- Top Metrics Bar -->
  <g transform="translate(56, 38)">
    <text x="0" y="12" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Placement Velocity</text>
    <!-- Growth Chip -->
    <rect x="122" y="0" width="50" height="16" rx="8" fill="#dcfce7"/>
    <path d="M128 9 L132 5 L136 9" stroke="#15803d" stroke-width="1.5" stroke-linecap="round"/>
    <text x="139" y="11" fill="#15803d" font-family="system-ui, sans-serif" font-size="8" font-weight="700">+34%</text>
  </g>

  <!-- Chart Grid Lines -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="56" y1="75" x2="224" y2="75"/>
    <line x1="56" y1="105" x2="224" y2="105"/>
    <line x1="56" y1="135" x2="224" y2="135"/>
  </g>

  <!-- Bar Visualizations -->
  <rect x="68" y="105" width="14" height="30" rx="4" fill="url(#an-bar-1)"/>
  <rect x="94" y="90" width="14" height="45" rx="4" fill="url(#an-bar-2)"/>
  <rect x="120" y="78" width="14" height="57" rx="4" fill="url(#an-bar-1)"/>
  <rect x="146" y="65" width="14" height="70" rx="4" fill="url(#an-bar-2)"/>
  <rect x="172" y="52" width="14" height="83" rx="4" fill="url(#an-bar-3)"/>

  <!-- Upward Trendline with Glowing Nodes -->
  <path d="M75 105 Q 100 88, 127 76 T 179 48" stroke="url(#trend-line)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="75" cy="105" r="3.5" fill="#06b6d4"/>
  <circle cx="127" cy="76" r="3.5" fill="#10b981"/>
  <circle cx="179" cy="48" r="4.5" fill="#10b981"/>
  <circle cx="179" cy="48" r="2" fill="#ffffff"/>

  <!-- Right Donut Mini-Chart Container -->
  <g transform="translate(196, 75)">
    <!-- Outer ring -->
    <circle cx="16" cy="16" r="14" stroke="#e2e8f0" stroke-width="5" fill="none"/>
    <circle cx="16" cy="16" r="14" stroke="#4f46e5" stroke-width="5" stroke-dasharray="60 100" stroke-linecap="round" fill="none" transform="rotate(-90 16 16)"/>
    <circle cx="16" cy="16" r="14" stroke="#ec4899" stroke-width="5" stroke-dasharray="25 100" stroke-dashoffset="-60" stroke-linecap="round" fill="none" transform="rotate(-90 16 16)"/>
    <text x="10" y="19" fill="#0f172a" font-family="system-ui, sans-serif" font-size="8" font-weight="700">92%</text>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(56, 150)">
    <circle cx="4" cy="4" r="3" fill="#4f46e5"/>
    <text x="11" y="7" fill="#64748b" font-family="system-ui, sans-serif" font-size="7.5">IT &amp; Core</text>
    <circle cx="58" cy="4" r="3" fill="#8b5cf6"/>
    <text x="65" y="7" fill="#64748b" font-family="system-ui, sans-serif" font-size="7.5">Finance</text>
    <circle cx="110" cy="4" r="3" fill="#ec4899"/>
    <text x="117" y="7" fill="#64748b" font-family="system-ui, sans-serif" font-size="7.5">Consulting</text>
  </g>
</svg>
