<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="recruiter-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="rec-header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="rec-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="140" cy="100" r="70" fill="#06b6d4" fill-opacity="0.08"/>
  <circle cx="210" cy="130" r="50" fill="#10b981" fill-opacity="0.1"/>

  <!-- Main Portal Window Frame -->
  <rect x="40" y="25" width="200" height="150" rx="14" fill="url(#recruiter-bg)" stroke="#cbd5e1" stroke-width="1.2" filter="url(#rec-shadow)"/>

  <!-- Window Header with Mac dots -->
  <rect x="40" y="25" width="200" height="28" rx="14" fill="url(#rec-header-grad)"/>
  <rect x="40" y="45" width="200" height="8" fill="url(#rec-header-grad)"/>
  <circle cx="56" cy="39" r="3.5" fill="#ef4444"/>
  <circle cx="68" cy="39" r="3.5" fill="#f59e0b"/>
  <circle cx="80" cy="39" r="3.5" fill="#10b981"/>
  <text x="100" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Recruiter Talent Hub</text>

  <!-- Left Sidebar Navigation Lines -->
  <rect x="52" y="65" width="36" height="6" rx="3" fill="#6366f1"/>
  <rect x="52" y="77" width="28" height="5" rx="2.5" fill="#cbd5e1"/>
  <rect x="52" y="88" width="32" height="5" rx="2.5" fill="#cbd5e1"/>
  <rect x="52" y="99" width="24" height="5" rx="2.5" fill="#cbd5e1"/>

  <!-- Candidate Card 1 (Active Shortlisted) -->
  <rect x="98" y="60" width="130" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="114" cy="78" r="10" fill="#e0e7ff"/>
  <circle cx="114" cy="75" r="4" fill="#4f46e5"/>
  <path d="M108 85 C108 81 110 80 114 80 C118 80 120 81 120 85 Z" fill="#4f46e5"/>
  <rect x="130" y="70" width="48" height="6" rx="3" fill="#1e293b"/>
  <rect x="130" y="80" width="32" height="4" rx="2" fill="#94a3b8"/>
  <!-- Shortlisted Tag -->
  <rect x="180" y="68" width="42" height="14" rx="7" fill="url(#badge-grad)"/>
  <text x="186" y="78" fill="#ffffff" font-family="system-ui, sans-serif" font-size="7" font-weight="700">Shortlisted</text>

  <!-- Candidate Card 2 (In Interview) -->
  <rect x="98" y="112" width="130" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="114" cy="130" r="10" fill="#fce7f3"/>
  <circle cx="114" cy="127" r="4" fill="#ec4899"/>
  <path d="M108 137 C108 133 110 132 114 132 C118 132 120 133 120 137 Z" fill="#ec4899"/>
  <rect x="130" y="122" width="52" height="6" rx="3" fill="#1e293b"/>
  <rect x="130" y="132" width="36" height="4" rx="2" fill="#94a3b8"/>
  <!-- Rating Stars -->
  <g transform="translate(182, 124)">
    <polygon points="4,1 5,3 8,3 5.5,5 6.5,7 4,5.5 1.5,7 2.5,5 0,3 3,3" fill="#f59e0b"/>
    <polygon points="12,1 13,3 16,3 13.5,5 14.5,7 12,5.5 9.5,7 10.5,5 8,3 11,3" fill="#f59e0b"/>
    <polygon points="20,1 21,3 24,3 21.5,5 22.5,7 20,5.5 17.5,7 18.5,5 16,3 19,3" fill="#f59e0b"/>
    <polygon points="28,1 29,3 32,3 29.5,5 30.5,7 28,5.5 25.5,7 26.5,5 24,3 27,3" fill="#f59e0b"/>
  </g>

  <!-- Floating Fast Hire Checkmark Badge -->
  <g transform="translate(18, 110)">
    <circle cx="18" cy="18" r="16" fill="#4f46e5" filter="url(#rec-shadow)"/>
    <!-- Checkmark & Handshake icon -->
    <path d="M12 18 L16 22 L24 14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
